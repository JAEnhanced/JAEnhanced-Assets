name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "jaenhanced/**"
      - "CMakeLists.txt"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "jaenhanced/**"
      - "CMakeLists.txt"
      - ".github/workflows/build.yml"

jobs:
  pk3:
    name: Build zZz_ja_enhanced.pk3
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@85e6279cec87321a52edac9c87bce653a07cf6c2 # v4.2.2

      - name: Build pk3
        run: |
          cmake -B build
          cmake --build build

      - uses: actions/upload-artifact@6027e3dd177782cd8ab9af838c04fd81a07f1d47 # v4.6.2
        with:
          name: zZz_ja_enhanced
          path: build/zZz_ja_enhanced.pk3
          if-no-files-found: error

  generate-release-body:
    name: Generate Release Body
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      release_body: ${{ steps.generate.outputs.release_body }}
    steps:
      - uses: actions/checkout@85e6279cec87321a52edac9c87bce653a07cf6c2 # v4.2.2
        with:
          fetch-depth: 0

      - name: Generate commit log
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_COMMIT=$(gh api repos/${{ github.repository }}/releases/tags/latest --jq '.target_commitish' 2>/dev/null || echo "")

          RELEASE_BODY="## Commits"

          if [ -n "$LATEST_COMMIT" ] && git rev-parse --quiet --verify "$LATEST_COMMIT^{commit}" >/dev/null; then
            COMMITS=$(git log $LATEST_COMMIT..HEAD --pretty=format:"%h|%s|%an")
          else
            COMMITS=$(git log -3 --pretty=format:"%h|%s|%an")
          fi

          while IFS='|' read -r hash subject author; do
            if [[ $subject =~ ^Merge\ pull\ request\ \#([0-9]+) ]]; then
              PR_NUM="${BASH_REMATCH[1]}"
              PR_LINK=" [#${PR_NUM}](https://github.com/${{ github.repository }}/pull/${PR_NUM})"
              RELEASE_BODY+=$'\n'"- $hash: $subject ($author)${PR_LINK}"
            elif [[ $subject =~ \(#([0-9]+)\)$ ]]; then
              PR_NUM="${BASH_REMATCH[1]}"
              subject=$(echo "$subject" | sed 's/ (#[0-9]\+)$//')
              PR_LINK=" [#${PR_NUM}](https://github.com/${{ github.repository }}/pull/${PR_NUM})"
              RELEASE_BODY+=$'\n'"- $hash: $subject ($author)${PR_LINK}"
            else
              RELEASE_BODY+=$'\n'"- $hash: $subject ($author)"
            fi
          done <<< "$COMMITS"

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "release_body<<$EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_BODY" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

  create-latest:
    name: Publish latest release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pk3, generate-release-body]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@85e6279cec87321a52edac9c87bce653a07cf6c2 # v4.2.2

      - name: Download pk3
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zZz_ja_enhanced
          path: artifacts

      - name: Create latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ needs.generate-release-body.outputs.release_body }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true

          gh release create latest \
            --title "Latest Build" \
            --notes "$RELEASE_BODY" \
            --target ${{ github.sha }} \
            artifacts/zZz_ja_enhanced.pk3
